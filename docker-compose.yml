services:
  app:
    build: .
    image: realtime-app:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      DB_PATH: /app/data/app.db
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
      WS_HEARTBEAT_MS: ${WS_HEARTBEAT_MS:-30000}
    volumes:
      - app-data:/app/data

volumes:
  app-data:
